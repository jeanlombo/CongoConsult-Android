name: Construire Congo Consult Android (APK de test)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Installer les dépendances et construire l'interface
        run: |
          npm install
          npm run build
      - name: Générer le projet Android Capacitor
        run: |
          npx cap add android
          npx cap sync android
          npx capacitor-assets generate --android
      - name: Produire l'APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CongoConsult-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
