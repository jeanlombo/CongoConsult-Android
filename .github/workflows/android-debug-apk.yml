name: AFRICA CONSULTING GROUP SARL - Generer APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Preparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Compatible avec le depot actuel, ou les fichiers sont a la racine.
      - name: Reconstituer les dossiers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src public/images public/icons assets
          for f in app.js entry.js config.js style.css; do
            if test -f "$f"; then cp "$f" "src/$f"; fi
            test -f "src/$f" || { echo "Fichier manquant: src/$f"; exit 1; }
          done
          for f in discussion.jpg equipe.jpg; do
            if test -f "$f"; then cp "$f" "public/images/$f"; fi
            test -f "public/images/$f" || { echo "Image manquante: public/images/$f"; exit 1; }
          done
          if test -f icon.svg; then cp icon.svg public/icons/icon.svg; fi
          test -f public/icons/icon.svg
          for f in icon-only.png icon-background.png icon-foreground.png splash.png splash-dark.png; do
            if test -f "$f"; then cp "$f" "assets/$f"; fi
            test -f "assets/$f" || { echo "Asset manquant: assets/$f"; exit 1; }
          done

      - name: Bloquer une compilation avec l'ancien nom
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
          const wantedName = 'AFRICA CONSULTING GROUP SARL';
          const wantedId = 'com.africaconsultinggroup.mobile';
          if (cfg.appName !== wantedName || cfg.appId !== wantedId) {
            console.error('ERREUR: remplacez capacitor.config.json par le fichier corrige.');
            console.error('Valeurs lues:', cfg.appName, cfg.appId);
            process.exit(1);
          }
          const html = fs.readFileSync('index.html', 'utf8');
          const js = fs.readFileSync('src/app.js', 'utf8');
          if (/Congo Consult/i.test(html + js) || /AFRICA CONSULTING GROUPE SARL/i.test(html + js)) {
            console.error('ERREUR: ancien nom detecte dans index.html ou app.js.');
            process.exit(1);
          }
          console.log('Nom Android confirme :', cfg.appName);
          NODE

      - name: Installer dependances et generer les pages
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparer le SDK Android
        uses: android-actions/setup-android@v4

      - name: Generer Android avec Capacitor
        run: |
          npx cap add android
          npx cap sync android
          npx capacitor-assets generate --android

      - name: Fixer le nom Android sans modifier le manifeste XML
        shell: bash
        run: |
          python3 - <<'PYXML'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          app_name = 'AFRICA CONSULTING GROUP SARL'
          strings_path = Path('android/app/src/main/res/values/strings.xml')
          manifest_path = Path('android/app/src/main/AndroidManifest.xml')

          if not strings_path.is_file() or not manifest_path.is_file():
              raise SystemExit('Fichiers Android introuvables: strings.xml ou AndroidManifest.xml')

          tree = ET.parse(strings_path)
          root = tree.getroot()
          label = next((element for element in root.findall('string')
                        if element.get('name') == 'app_name'), None)
          if label is None:
              label = ET.SubElement(root, 'string', {'name': 'app_name'})
          label.text = app_name
          ET.indent(tree, space='    ')
          tree.write(strings_path, encoding='utf-8', xml_declaration=True)

          # Ne jamais reecrire AndroidManifest.xml avec ElementTree :
          # cela pourrait supprimer xmlns:android et casser Gradle.
          manifest = manifest_path.read_text(encoding='utf-8')
          expected_ns = 'xmlns:android="http://schemas.android.com/apk/res/android"'
          if expected_ns not in manifest:
              raise SystemExit('AndroidManifest.xml : declaration xmlns:android absente')
          if 'android:label="@string/app_name"' not in manifest:
              raise SystemExit('AndroidManifest.xml : le label doit pointer vers @string/app_name')
          ET.parse(manifest_path)  # Valide la syntaxe sans changer le fichier.
          print('Nom Android configure :', app_name)
          print('Manifeste XML valide et espace de noms preserve.')
          PYXML

      - name: Compiler un nouvel APK Android
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK a telecharger
        uses: actions/upload-artifact@v4
        with:
          name: AFRICA-CONSULTING-GROUP-SARL-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
