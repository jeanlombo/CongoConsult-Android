name: Congo Consult - Generer APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer les fichiers du depot
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Remettre les fichiers dans les dossiers attendus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src public/images public/icons assets
          for f in app.js entry.js config.js style.css; do
            test -f "$f"
            cp "$f" "src/$f"
          done
          for f in discussion.jpg equipe.jpg; do
            test -f "$f"
            cp "$f" "public/images/$f"
          done
          test -f icon.svg
          cp icon.svg public/icons/icon.svg
          for f in icon-only.png icon-background.png icon-foreground.png splash.png splash-dark.png; do
            test -f "$f"
            cp "$f" "assets/$f"
          done
          echo "Structure reconstituee avec succes"

      - name: Installer les dependances et compiler l'interface
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparer Android SDK
        uses: android-actions/setup-android@v4

      - name: Generer le projet Android Capacitor
        run: |
          npx cap add android
          npx cap sync android
          npx capacitor-assets generate --android

      - name: Compiler l'APK de test
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Permettre le telechargement de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: CongoConsult-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
